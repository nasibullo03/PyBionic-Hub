name: Проверка ботов

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Зависимости ботов
        run: |
          python -m pip install --upgrade pip
          pip install ruff pyTelegramBotAPI Pillow qrcode yt-dlp "discord.py>=2.4"

      - name: Ошибки, которые ломают запуск (неизвестные имена, синтаксис)
        run: ruff check --select F821,F811,F823,E9,F63,F7 --output-format github templates tools

      - name: Общие файлы одинаковые во всех ботах
        run: python tools/sync_shared.py --check

      - name: Каталог, переводы и импорт каждого бота
        run: python tools/check_bots.py

      - name: ZIP-архивы и sha256 совпадают с кодом
        run: python tools/build_catalog.py --check
